# AAP2 OpenSSH Match blocks. TEMPLATE, NOT an auto-installable sshd_config.
# Append manually in the correct place AFTER global settings.
# Verify Include/Match order, sshd -t, sshd -T -C and real connections first.
# aap2-setup must never install this file or reload sshd.
#
# Enrollment user: temporary PIN/password, chrooted internal-sftp only.
Match Group aap2-enroll
    AuthenticationMethods password
    PasswordAuthentication yes
    KbdInteractiveAuthentication no
    PubkeyAuthentication no
    ForceCommand internal-sftp
    ChrootDirectory /var/lib/aap2/enroll/%u
    DisableForwarding yes
    PermitTTY no
    MaxSessions 1

# Permanent device: publickey-only SSH transport, reverse TCP forward only.
# Individual authorized key MUST include:
# restrict,port-forwarding,permitlisten="127.0.0.1:10909" ecdsa-sha2-nistp256 AAAA...
Match Group aap2-proxy
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthorizedKeysFile /etc/ssh/aap2-authorized-keys/%u
    AuthorizedKeysCommand none
    TrustedUserCAKeys none
    HostbasedAuthentication no
    AllowTcpForwarding remote
    PermitOpen none
    GatewayPorts no
    AllowStreamLocalForwarding no
    MaxSessions 0
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PermitUserRC no
    ClientAliveInterval 15
    ClientAliveCountMax 2
