name: Android debug APK

on:
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: 'false'

      - name: Ensure Android 35 is installed
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check local build and soak scripts shell syntax
        run: |
          for s in scripts/soak-monitor.sh scripts/build-signed-apk.sh scripts/aap2-local.sh scripts/aap2-spare-upgrade.sh; do
            sh -n "$s"
          done

      - name: Check local maintainer Makefile without signing or ADB
        run: |
          make --no-print-directory -n build VERSION_CODE=20011
          make --no-print-directory -n install Z=ci-device
          make --no-print-directory -n curl S2=example.net PORT=11011
          make --no-print-directory -n check

      - name: Release-tool safety tests (no signing or GitHub changes)
        run: |
          python3 -m py_compile scripts/aap2-release.py scripts/test_aap2_release.py
          python3 -m unittest discover -s scripts -p 'test_aap2_release.py' -v
          make --no-print-directory help
          make --no-print-directory -n release TYPE=rc1
          make --no-print-directory -n publish TYPE=release
          if make --no-print-directory publish >/tmp/aap2-missing-type.log 2>&1; then
            echo 'publish without TYPE must fail' >&2
            exit 1
          fi
          grep -F 'TYPE is required' /tmp/aap2-missing-type.log
          if TYPE=release make --no-print-directory publish >/tmp/aap2-ambient-type.log 2>&1; then
            echo 'ambient TYPE must not authorize publication' >&2
            exit 1
          fi
          grep -F 'TYPE is required' /tmp/aap2-ambient-type.log

      - name: Verify Android enrollment is excluded from cloud and device transfer
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          app = ET.parse("app/src/main/AndroidManifest.xml").getroot().find("application")
          ns = "{http://schemas.android.com/apk/res/android}"
          assert app.get(ns + "allowBackup") == "false"
          assert app.get(ns + "fullBackupContent") == "@xml/backup_rules"
          assert app.get(ns + "dataExtractionRules") == "@xml/data_extraction_rules"
          legacy = ET.parse("app/src/main/res/xml/backup_rules.xml").getroot()
          domains = {(e.get("domain"), e.get("path")) for e in legacy.findall("exclude")}
          assert {("root", "."), ("device_root", "."), ("external", ".")} <= domains
          newer = ET.parse("app/src/main/res/xml/data_extraction_rules.xml").getroot()
          for section in ("cloud-backup", "device-transfer"):
              node = newer.find(section)
              assert node is not None, section
              excluded = {(e.get("domain"), e.get("path")) for e in node.findall("exclude")}
              assert {(domain, ".") for domain in
                      ("root", "device_root", "sharedpref", "device_sharedpref",
                       "database", "device_database", "file", "device_file", "external")} <= excluded, section
          PY

      - name: Build and unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest :app:assembleGithubRelease :app:testGithubDebugUnitTest :app:assembleFdroidRelease :app:testFdroidDebugUnitTest

      - name: Verify F-Droid package excludes in-app updater permission
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk > /tmp/fdroid-permissions
          if grep -F 'android.permission.REQUEST_INSTALL_PACKAGES' /tmp/fdroid-permissions; then
            echo 'F-Droid APK must not request package installation' >&2
            exit 1
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aap2-debug-apk
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload P0 Android instrumentation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aap2-p0-androidTest-apk
          path: app/build/outputs/apk/androidTest/github/debug/app-github-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
